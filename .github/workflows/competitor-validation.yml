name: Competitor Validation

on:
  push:
    branches:
      - fix/competitor-reliability-20260825
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venturemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venturemind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/venturemind_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Targeted competitor evidence tests
        run: uv run pytest tests/unit/research/test_competitor_evidence.py -v

      - name: Targeted competitor crew tests
        run: uv run pytest tests/unit/crews/competitor_intelligence -v

      - name: Full backend suite
        run: uv run pytest
