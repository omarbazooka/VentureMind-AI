name: Backend Tests

on:
  push:
    branches:
      - master
      - fix/task6-readiness-tests
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venturemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venturemind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/venturemind_test
      APP_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run full test suite
        run: uv run pytest -v
